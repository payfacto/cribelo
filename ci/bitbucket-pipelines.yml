# Cribelo on Bitbucket Cloud pull requests (PayFacto fork). Copy the step
# below into your bitbucket-pipelines.yml. The binary and the script come
# from the public GitHub mirror payfacto/cribelo: no token to download.
#
# Optional, per repository:
#   CRIBELO_TOKEN           secured, a repository access token of your
#                           repository with the pullrequest:write scope: the
#                           plan is posted as one comment, edited on each push.
#   CRIBELO_BOT_ACCOUNT_ID  the account id of that token, so only its own
#                           comment is edited.
#   CRIBELO_VERSION         a release such as 2.4.0-pf.1; latest by default.
#                           Pin it: with latest, the script runs from the main
#                           branch of payfacto/cribelo with your secrets.
#   CRIBELO_BUDGET, CRIBELO_TOP, CRIBELO_FAIL_ON, CRIBELO_FAIL_OVER: as for
#                           the GitHub Action. The step fails only with these.

definitions:
  steps:
    - step: &cribelo
        name: cribelo
        # The binary is built with cgo against the glibc of Debian bookworm: no Alpine.
        image: debian:bookworm-slim
        clone:
          depth: full
        script:
          # A failed package install or download skips cribelo: it never fails
          # the pull request.
          - |
            version="${CRIBELO_VERSION:-latest}"
            github="https://github.com/payfacto/cribelo"
            if [ "$version" = latest ]; then
              binary_url="$github/releases/latest/download/cribelo_Linux_x86_64"; ref="main"
            else
              binary_url="$github/releases/download/v${version#v}/cribelo_Linux_x86_64"; ref="v${version#v}"
            fi
            if ! { apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends ca-certificates curl git jq >/dev/null; }; then
              echo "cribelo: could not install curl, git and jq, skipping"
            elif ! curl -fsSL "${CRIBELO_DOWNLOAD_URL:-$binary_url}" -o /usr/local/bin/cribelo \
              || ! curl -fsSL "https://raw.githubusercontent.com/payfacto/cribelo/$ref/scripts/bitbucket-pr-comment.sh" -o /tmp/cribelo-pr-comment.sh; then
              echo "cribelo: could not download cribelo $version, skipping"
            else
              git config --global --add safe.directory "$BITBUCKET_CLONE_DIR"
              chmod +x /usr/local/bin/cribelo
              bash /tmp/cribelo-pr-comment.sh
            fi
        artifacts:
          - cribelo-plan.md

pipelines:
  pull-requests:
    '**':
      - step: *cribelo
