# Cribelo on Bitbucket Cloud pull requests (PayFacto fork). Copy the step
# below into your bitbucket-pipelines.yml.
#
# Needs, once per workspace: the secured workspace variable
# CRIBELO_DOWNLOAD_TOKEN, a read-only repository access token of
# payfactopay/cribelo. It downloads the binary and the script.
#
# Optional, per repository:
#   CRIBELO_TOKEN           secured, a repository access token of your
#                           repository with the pullrequest:write scope: the
#                           plan is posted as one comment, edited on each push.
#   CRIBELO_BOT_ACCOUNT_ID  the account id of that token, so only its own
#                           comment is edited.
#   CRIBELO_VERSION         a release such as 2.4.0-pf.1; latest by default.
#                           Pin it: with latest, the script runs from the main
#                           branch of payfactopay/cribelo with your secrets.
#   CRIBELO_BUDGET, CRIBELO_TOP, CRIBELO_FAIL_ON, CRIBELO_FAIL_OVER: as for
#                           the GitHub Action. The step fails only with these.

definitions:
  steps:
    - step: &cribelo
        name: cribelo
        # The binary is built with cgo against the glibc of Debian bookworm: no Alpine.
        image: debian:bookworm-slim
        clone:
          depth: full
        script:
          # A missing token or a failed download skips cribelo, it never fails the pull request.
          - apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends ca-certificates curl git jq >/dev/null
          - |
            version="${CRIBELO_VERSION:-latest}"
            api="https://api.bitbucket.org/2.0/repositories/payfactopay/cribelo"
            if [ "$version" = latest ]; then
              binary="cribelo_Linux_x86_64"; ref="main"
            else
              binary="cribelo_${version#v}_Linux_x86_64"; ref="v${version#v}"
            fi
            git config --global --add safe.directory "$BITBUCKET_CLONE_DIR"
            if [ -z "${CRIBELO_DOWNLOAD_TOKEN:-}" ]; then
              echo "cribelo: CRIBELO_DOWNLOAD_TOKEN is not set, skipping (see docs/bitbucket.md)"
            elif ! curl -fsSL -H "Authorization: Bearer $CRIBELO_DOWNLOAD_TOKEN" "${CRIBELO_DOWNLOAD_URL:-$api/downloads/$binary}" -o /usr/local/bin/cribelo \
              || ! curl -fsSL -H "Authorization: Bearer $CRIBELO_DOWNLOAD_TOKEN" "$api/src/$ref/scripts/bitbucket-pr-comment.sh" -o /tmp/cribelo-pr-comment.sh; then
              echo "cribelo: could not download cribelo $version, skipping"
            else
              chmod +x /usr/local/bin/cribelo
              bash /tmp/cribelo-pr-comment.sh
            fi
        artifacts:
          - cribelo-plan.md

pipelines:
  pull-requests:
    '**':
      - step: *cribelo
