# A tag vX.Y.Z builds the cribelo binary for every platform; the publish job
# then creates the release of the same name with every binary, the Bitbucket
# CI script and SHA256SUMS, as a draft published in one step (release
# immutability: nothing is added or replaced after). install.sh, action.yml
# and the CI templates download from there and check SHA256SUMS.
# A version with a dash (v1.0.0-rc.1) is published as a pre-release, which
# releases/latest ignores; a release of the PayFacto fork (v2.4.0-pf.1) is
# stable (scripts/release-kind.sh). This repository is the public mirror of
# Bitbucket payfactopay/cribelo, pushed by its bitbucket-pipelines.yml.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cribelo_Linux_x86_64
          - os: ubuntu-24.04-arm
            asset: cribelo_Linux_arm64
          - os: macos-15-intel
            asset: cribelo_Darwin_x86_64
          - os: macos-15
            asset: cribelo_Darwin_arm64
          - os: windows-latest
            asset: cribelo_Windows_x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Toolchain (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Toolchain (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 1
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "out/$ASSET" .
          "./out/$ASSET" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Bitbucket CI template runs this script: it ships with the
          # release, under SHA256SUMS, instead of being read from a branch.
          cp scripts/bitbucket-pr-comment.sh out/
          sh scripts/publish-release.sh "$GITHUB_REF_NAME" out

  # Rewrites Formula/cribelo.rb in payfacto/homebrew-tap so that
  # `brew install payfacto/tap/cribelo` gets this version. Pre-releases are
  # skipped (scripts/release-kind.sh: v2.4.0-pf.1 is stable).
  # Needs the HOMEBREW_TAP_TOKEN secret: a token with contents: write on
  # payfacto/homebrew-tap.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip a pre-release
        id: kind
        run: echo "kind=$(sh scripts/release-kind.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Render the formula
        if: steps.kind.outputs.kind == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" -D assets -p 'cribelo_Darwin_*' -p 'cribelo_Linux_*'
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" assets > cribelo.rb

      - name: Push to the tap
        if: steps.kind.outputs.kind == 'stable'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/payfacto/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp cribelo.rb tap/Formula/cribelo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Formula/cribelo.rb
          git diff --cached --quiet && exit 0
          git commit -m "cribelo ${GITHUB_REF_NAME#v}"
          git push
